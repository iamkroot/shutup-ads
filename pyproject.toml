[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shutup-ads"
version = "0.1.0"
description = "Real-time basketball commercial break detector and stream attenuator powered by YAMNet"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "kroot" }
]
dependencies = [
    "numpy>=1.24.0",
    "onnxruntime>=1.16.0",
    "pulsectl>=24.4.0",
    "rich>=13.0.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "soundfile>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
shutup-ads = "shutup_ads.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["shutup_ads"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
